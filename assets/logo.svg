<pattern id="cc-p-knit" width="4.6" height="4" patternUnits="userSpaceOnUse"><path class="knit-stitch" d="M.5 .5L2.3 3.2L4.1 .5"/></pattern>
<filter id="cc-f-soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2.2"/></filter>
