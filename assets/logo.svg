<svg x="50" y="52" width="412" height="412" viewBox="0 0 240 240" class="ctl ctl-chat" overflow="visible"><!-- Control chat / Pebble  (c) Khan3D 2026-11-16, profile edition --><style>
.ctl-chat{--ctl-blue:var(--control-blue,#7F9CC3);--ctl-blue-light:var(--control-blue-light,#B4C8E2);--ctl-blue-deep:var(--control-blue-deep,#5E7DA8);--ctl-oat:var(--control-oat,#DCCDB2);--ctl-oat-light:var(--control-oat-light,#EFE6D5);--ctl-oat-deep:var(--control-oat-deep,#B6A283);--ctl-oat-cave:var(--control-oat-cave,#8E7B5E);--ctl-peach:var(--control-peach,#E9A99A);--ctl-ink:var(--control-ink,#2E3A55);--ctl-shadow:var(--control-shadow,rgba(80,64,40,.22));overflow:visible}
.ctl-chat .s-blue-hi{stop-color:var(--ctl-blue-light)}.ctl-chat .s-blue{stop-color:var(--ctl-blue)}.ctl-chat .s-blue-lo{stop-color:var(--ctl-blue-deep)}
.ctl-chat .s-oat-hi{stop-color:var(--ctl-oat-light)}.ctl-chat .s-oat{stop-color:var(--ctl-oat)}.ctl-chat .s-oat-lo{stop-color:var(--ctl-oat-deep)}.ctl-chat .s-cave{stop-color:var(--ctl-oat-cave)}
.ctl-chat .ink{fill:var(--ctl-ink)}.ctl-chat .ink-line{fill:none;stroke:var(--ctl-ink);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.ctl-chat .knit-stitch{fill:none;stroke:var(--ctl-oat-deep);stroke-width:.85;stroke-linecap:round;opacity:.42}
.ctl-chat .blush{fill:var(--ctl-peach);opacity:.7}.ctl-chat .ground{fill:var(--ctl-shadow)}
.ctl-chat .rig{transform-box:view-box;transform-origin:120px 204px;animation:cc-breathe 3.6s ease-in-out infinite}
@keyframes cc-breathe{0%,100%{transform:scale(1,1)}50%{transform:scale(1.012,.985) translateY(.5px)}}
.ctl-chat .eyes-open{transform-box:fill-box;transform-origin:center;animation:cc-blink 5s infinite}
@keyframes cc-blink{0%,94%,100%{transform:scaleY(1)}96.5%{transform:scaleY(.12)}}
.ctl-chat .float-shadow{transform-box:fill-box;transform-origin:center;animation:cc-shadow 3.6s ease-in-out infinite}
@keyframes cc-shadow{0%,100%{transform:scaleX(1)}50%{transform:scaleX(1.02)}}
.ctl-chat .arm-wave{transform-box:view-box;transform-origin:178px 150px;animation:cc-wave 1.1s ease-in-out infinite}
@keyframes cc-wave{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(14deg)}}
.ctl-chat .sparkle{fill:var(--ctl-oat-deep);transform-box:fill-box;transform-origin:center;animation:cc-spark 2.2s ease-in-out infinite}
.ctl-chat .sparkle:nth-child(2){animation-delay:.7s}.ctl-chat .sparkle:nth-child(3){animation-delay:1.4s}
@keyframes cc-spark{0%,100%{transform:scale(.3);opacity:0}50%{transform:scale(1);opacity:1}}
@media (prefers-reduced-motion:reduce){.ctl-chat *{animation:none!important}}</style><defs>
<radialGradient id="cc-g-body" cx=".36" cy=".3" r=".82"><stop offset="0" class="s-blue-hi"/><stop offset=".5" class="s-blue"/><stop offset="1" class="s-blue-lo"/></radialGradient>
<radialGradient id="cc-g-hood" cx=".34" cy=".22" r=".9"><stop offset="0" class="s-oat-hi"/><stop offset=".55" class="s-oat"/><stop offset="1" class="s-oat-lo"/></radialGradient>
