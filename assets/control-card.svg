<text x="56" y="184" font-size="24" font-weight="600" fill="#5B5646">AI Team Control Center</text>
<text x="56" y="228" font-size="17" fill="#5B5646">An AI-powered workspace for individuals,</text>
<text x="56" y="252" font-size="17" fill="#5B5646">small teams and creative studios.</text>
