<svg x="661" y="66" width="250" height="250" viewBox="0 0 240 240" class="ctl ctl-code" overflow="visible"><!-- Control code / Maestro  (c) Khan3D 2026-11-16, profile edition --><style>
.ctl-code{--ctl-blue:var(--control-blue,#7F9CC3);--ctl-blue-light:var(--control-blue-light,#AFC5E2);--ctl-blue-deep:var(--control-blue-deep,#5D7CA8);--ctl-oat:var(--control-oat,#DCCDB2);--ctl-oat-light:var(--control-oat-light,#F0E7D6);--ctl-oat-deep:var(--control-oat-deep,#BBA788);--ctl-peach:var(--control-peach,#E9A99A);--ctl-ink:var(--control-ink,#2B2B30);--ctl-wood:var(--control-wood,#A97C55);--ctl-wood-light:var(--control-wood-light,#C9A27A);--ctl-shadow:var(--control-shadow,rgba(80,64,40,.22));overflow:visible}
.ctl-code .s-blue-hi{stop-color:var(--ctl-blue-light)}.ctl-code .s-blue{stop-color:var(--ctl-blue)}.ctl-code .s-blue-lo{stop-color:var(--ctl-blue-deep)}
.ctl-code .s-oat-hi{stop-color:var(--ctl-oat-light)}.ctl-code .s-oat{stop-color:var(--ctl-oat)}.ctl-code .s-oat-lo{stop-color:var(--ctl-oat-deep)}
.ctl-code .ink{fill:var(--ctl-ink)}.ctl-code .hl{fill:#fff;opacity:.85}.ctl-code .blush{fill:var(--ctl-peach);opacity:.85}
.ctl-code .oat{fill:url(#cd-g-oat)}.ctl-code .blue{fill:url(#cd-g-body)}
.ctl-code .baton{stroke:var(--ctl-wood);stroke-width:3.2;stroke-linecap:round;fill:none}.ctl-code .baton-hl{stroke:var(--ctl-wood-light);stroke-width:1;stroke-linecap:round;fill:none;opacity:.8}
.ctl-code .ground{fill:var(--ctl-shadow)}
.ctl-code .note{fill:var(--ctl-ink)}.ctl-code .note-stem{stroke:var(--ctl-ink);stroke-width:1.6;fill:none;stroke-linecap:round}
.ctl-code .arm-l{transform:rotate(140deg);animation:cd-cond 1.2s ease-in-out infinite}.ctl-code .arm-r{transform:rotate(-128deg);animation:cd-cond-r 1.2s ease-in-out infinite}
@keyframes cd-cond{0%,100%{transform:rotate(112deg)}50%{transform:rotate(142deg)}}
@keyframes cd-cond-r{0%,100%{transform:rotate(-120deg)}50%{transform:rotate(-140deg)}}
.ctl-code .rig{transform-box:view-box;transform-origin:120px 202px;animation:cd-sway 1.2s ease-in-out infinite}
@keyframes cd-sway{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(2deg)}}
.ctl-code .eyes-open{transform-box:fill-box;transform-origin:center;animation:cd-blink 5.4s infinite}
@keyframes cd-blink{0%,93%,100%{transform:scaleY(1)}95.5%{transform:scaleY(.1)}}
.ctl-code .notes>g{animation:cd-note 2.4s ease-in-out infinite;opacity:0}
.ctl-code .notes>g:nth-child(2){animation-delay:.6s}.ctl-code .notes>g:nth-child(3){animation-delay:1.2s}.ctl-code .notes>g:nth-child(4){animation-delay:1.8s}
@keyframes cd-note{0%{opacity:0;transform:translateY(6px)}25%{opacity:1}100%{opacity:0;transform:translateY(-16px)}}
@media (prefers-reduced-motion:reduce){.ctl-code *{animation:none!important}}</style><defs>
